name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: npx playwright install --with-deps chromium
      # Pyodide (~40 MB) as fetched by the browser tests; keyed on the worker,
      # which pins the Pyodide version.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/pyodide-e2e
          key: pyodide-e2e-${{ hashFiles('src/engines/python-worker.js') }}
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
